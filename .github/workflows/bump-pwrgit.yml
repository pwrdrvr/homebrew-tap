name: Publish PwrGit Stable Latest
run-name: PwrGit Homebrew sync ${{ inputs.version || 'Stable Latest' }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Promoted stable version without v (empty resolves Latest)
        required: false
        type: string
  schedule:
    - cron: "7,22,37,52 * * * *"
  pull_request:
    paths:
      - Casks/pwrgit.rb
      - scripts/**
      - tests/**
      - .github/actions/**
      - .github/workflows/sync.yml
      - .github/workflows/bump-pwrgit.yml
permissions:
  contents: write
  actions: read
  issues: write
concurrency:
  group: pwrgit-sync-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  sync:
    uses: ./.github/workflows/sync.yml
    with:
      cask: pwrgit
      version: ${{ inputs.version || '' }}
    secrets: inherit
