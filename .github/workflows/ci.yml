# PR gate: the cask must lint, audit (URL + sha256 verified online), and
# actually install + pass a signature check on a current macOS runner.
name: CI

on:
  workflow_dispatch:
    inputs:
      force-validation:
        description: Run native validation even if this exact candidate already passed (installer bytes still cached)
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.validation.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Test cask selection
        run: python3 -m unittest discover -s tests -v
      - name: Select casks
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A full checkout contains reachable history, but a force push can
          # leave the previous main tip outside every advertised branch/tag.
          # Fetch only that commit/tree when missing; two-dot selection needs
          # no ancestors. Existing/new-branch/PR/manual runs need no extra fetch.
          if [[ "$EVENT" == push && "$BASE" =~ ^[0-9a-f]{40}$ && ! "$BASE" =~ ^0+$ ]] \
            && ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            git fetch --no-tags --no-recurse-submodules --depth=1 origin "$BASE"
          fi
          selection="$(python3 scripts/select-casks.py --event "$EVENT" --base "$BASE")"
          echo "$selection" > "$RUNNER_TEMP/cask-selection.json"
          echo "$selection" >>"$GITHUB_STEP_SUMMARY"
      - name: Reuse identical successful native validations for every app
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          FORCE_VALIDATION: ${{ inputs.force-validation || false }}
        run: python3 scripts/validation-plan.py --selection "$RUNNER_TEMP/cask-selection.json"

  cask:
    needs: select
    if: fromJSON(needs.select.outputs.matrix).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # `brew audit --online` queries the GitHub API for repo metadata. Hosted
    # runners share an egress IP, so the anonymous 60/hr limit is routinely
    # already spent by the time a job starts; the job token lifts it.
    env:
      CASK: ${{ matrix.cask }}
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Scoped to the cask file on purpose. `brew style <tap>` also runs
      # shellcheck/shfmt/actionlint across the repo's scripts and
      # workflows, which is a different job from validating the Ruby.
      - name: Lint the cask
        run: brew style "Casks/${CASK}.rb"

      # Homebrew disabled path-based invocation ("Calling `brew audit
      # [path ...]` is disabled! Use `brew audit [name ...]` instead"), so
      # the checkout is linked in as a real tap and the commands below
      # address the cask by its fully-qualified token. Linking the
      # checkout — rather than `brew tap pwrdrvr/tap` — is what makes this
      # gate the PR's cask instead of the one already on main.
      - name: Link the checkout as a tap
        run: |
          set -euo pipefail
          taps="$(brew --repository)/Library/Taps/pwrdrvr"
          mkdir -p "${taps}"
          ln -s "${GITHUB_WORKSPACE}" "${taps}/homebrew-tap"
          brew tap | grep -qx "pwrdrvr/tap"

      # Homebrew ignores casks from untrusted taps (docs.brew.sh/Tap-Trust).
      # Trust this one cask rather than the whole tap, and only on brews
      # new enough to have the command.
      - name: Trust the cask
        run: |
          set -euo pipefail
          if brew trust --help >/dev/null 2>&1; then
            brew trust --cask "pwrdrvr/tap/${CASK}"
          else
            echo "brew trust not available on this Homebrew; skipping"
          fi

      - name: Restore verified native installer into Homebrew's cache
        uses: ./.github/actions/cache-installer
        with:
          token: pwrdrvr/tap/${{ matrix.cask }}

      - name: Audit the cask against its release
        run: brew audit --cask --online "pwrdrvr/tap/${CASK}"

      - name: Install
        id: install
        run: brew install --cask "pwrdrvr/tap/${CASK}"

      # The `app` stanza moves the real bundle to /Applications (the
      # Caskroom keeps only a symlink pointing back at it), which is what
      # keeps TCC, Launch Services and Spotlight seeing a normal app path.
      # Assert that rather than trust it.
      - name: Verify the installed app
        run: |
          set -euo pipefail
          apps="$(brew info --json=v2 --cask "pwrdrvr/tap/${CASK}" | jq -er '
            [.casks[0].artifacts[] | select(.app) |
              (.target // .app[1].target // .app[0]) | split("/")[-1]] |
            if length > 0 then .[] else error("cask has no app artifact") end
          ')"
          while IFS= read -r bundle; do
            app="/Applications/${bundle}"
            test -d "$app"
            test ! -L "$app"
            codesign --verify --deep --strict "$app"
            codesign -dv --verbose=2 "$app" 2>&1 \
              | grep -q "Authority=Developer ID Application: PwrDrvr LLC"
            spctl -a -vv "$app"
          done <<<"$apps"

      - name: Uninstall
        if: always() && steps.install.outcome == 'success'
        run: brew uninstall --cask "pwrdrvr/tap/${CASK}"

      - name: Record successful native validation
        env:
          KEY: ${{ matrix.key }}
        run: |
          mkdir -p .local/validation/cask
          printf '%s' "$KEY" > .local/validation/cask/key
      - uses: actions/cache/save@v4
        with:
          path: .local/validation/cask
          key: ${{ matrix.key }}
          enableCrossOsArchive: true
