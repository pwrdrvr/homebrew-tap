# Keep Casks/pwrsnap.rb pointed at the latest *stable* PwrSnap release.
#
# Runs every six hours (and on demand). When GitHub's /releases/latest for
# pwrdrvr/PwrSnap is newer than the cask, it re-hashes the DMG, lints +
# audits the cask, and opens a PR. Merge the PR and the tap is updated —
# users get it on their next `brew update`.
name: Bump pwrsnap cask

on:
  workflow_dispatch:
    inputs:
      version:
        description: "PwrSnap version to pin (no leading v). Empty = latest stable."
        required: false
        default: ""
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      current: ${{ steps.resolve.outputs.current }}
    # Same reason as ci.yml: `brew audit --online` needs an authenticated
    # GitHub API to clear the shared-runner rate limit.
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current="$(sed -nE 's/^  version "(.*)"/\1/p' Casks/pwrsnap.rb)"
          v="${REQUESTED#v}"

          # Compare as versions, not as strings: 1.10.0 is newer than 1.9.0.
          newer_than_cask() {
            [ "${1}" != "${current}" ] &&
              [ "$(printf '%s\n%s\n' "${1}" "${current}" | sort -V | tail -1)" = "${1}" ]
          }

          if [ -n "${v}" ]; then
            # An operator typed a version. Honour it, including a deliberate
            # rollback -- a bad stable release is exactly when you need one --
            # but do not let it happen quietly.
            if [ "${v}" != "${current}" ] && ! newer_than_cask "${v}"; then
              echo "::warning::pinning pwrsnap back to ${v} from ${current} (explicitly requested)"
            fi
          else
            v="$(gh api repos/pwrdrvr/PwrSnap/releases/latest --jq .tag_name | sed 's/^v//')"

            # /releases/latest can legitimately point BACKWARDS, and this is
            # not a mistake to be corrected upstream. A 1.0.x maintenance
            # patch is marked `latest` on GitHub after 1.1 has shipped,
            # because PwrSnap's in-app updater reads that pointer and 1.0
            # users would otherwise never be offered the patch. The app
            # refuses the resulting downgrade. Homebrew will not:
            #
            #   # Cask::Cask#outdated_version
            #   return if installed_version == version
            #
            # That is plain equality with no ordering, so a cask that moves
            # backwards downgrades anyone running `brew upgrade --cask
            # pwrsnap` (naming a cask forces greedy, which skips the
            # `auto_updates` guard) and hands every NEW `brew install` the
            # older build -- that one has no installed version to compare
            # against, and so no defence at all.
            if [ "${v}" != "${current}" ] && ! newer_than_cask "${v}"; then
              echo "::notice::Holding at ${current}: GitHub's latest stable is ${v}, which is older. Expected while a maintenance patch is marked latest."
              echo "Held at \`${current}\` — GitHub's latest stable is \`${v}\`, which is older. Expected while a maintenance patch is marked latest." \
                >> "${GITHUB_STEP_SUMMARY}"
              v="${current}"
            fi
          fi

          echo "version=${v}"  >> "${GITHUB_OUTPUT}"
          echo "current=${current}" >> "${GITHUB_OUTPUT}"
          echo "resolved: ${v} — cask has: ${current}"

      - if: steps.resolve.outputs.version != steps.resolve.outputs.current
        name: Rewrite version + sha256
        run: scripts/bump-cask.sh "${{ steps.resolve.outputs.version }}"

      - if: steps.resolve.outputs.version != steps.resolve.outputs.current
        name: Lint the cask
        run: brew style Casks/pwrsnap.rb

      # Path-based `brew audit` is disabled, so link the checkout in as a
      # real tap and audit the cask by its fully-qualified token. Untrusted
      # taps are ignored (docs.brew.sh/Tap-Trust), hence `brew trust`.
      - if: steps.resolve.outputs.version != steps.resolve.outputs.current
        name: Audit the cask against its live download
        run: |
          set -euo pipefail
          taps="$(brew --repository)/Library/Taps/pwrdrvr"
          mkdir -p "${taps}"
          ln -s "${GITHUB_WORKSPACE}" "${taps}/homebrew-tap"
          if brew trust --help >/dev/null 2>&1; then
            brew trust --cask pwrdrvr/tap/pwrsnap
          fi
          brew audit --cask --online pwrdrvr/tap/pwrsnap

      - if: steps.resolve.outputs.version != steps.resolve.outputs.current
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bump/pwrsnap-${{ steps.resolve.outputs.version }}
          title: "pwrsnap ${{ steps.resolve.outputs.version }}"
          commit-message: "pwrsnap ${{ steps.resolve.outputs.version }}"
          body: |
            Automated bump to PwrSnap ${{ steps.resolve.outputs.version }}
            (https://github.com/pwrdrvr/PwrSnap/releases/tag/v${{ steps.resolve.outputs.version }}).

            `brew style` and `brew audit --cask --online` passed on the runner.
          delete-branch: true

  # A scheduled job that fails silently is the same as no job at all. This
  # workflow failed 15 consecutive runs on a Homebrew deprecation while the
  # cask sat four releases behind (1.0.3 vs 1.1.2) and nobody noticed -- the
  # 85 runs before that were all no-ops, so the bump path had never actually
  # run since it was merged. Email on a failed cron was evidently not enough,
  # so a failure now files an issue that stays open until someone fixes it.
  notify:
    needs: bump
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: File a tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESOLVED: ${{ needs.bump.outputs.version }}
          CURRENT: ${{ needs.bump.outputs.current }}
        run: |
          set -euo pipefail

          gh label create bump-failure \
            --repo "${GITHUB_REPOSITORY}" \
            --color b60205 \
            --description "The scheduled cask bump is failing" \
            --force

          # One issue per outage, not one per run -- this cron fires every six hours,
          # so commenting on each failure would bury the signal it exists to raise.
          existing="$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --label bump-failure \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            echo "Issue #${existing} already tracks this outage; not filing another."
            exit 0
          fi

          # `resolve` may itself be what failed, so neither version is guaranteed set.
          body="${RUNNER_TEMP}/bump-failure.md"
          {
            echo "The scheduled \`bump.yml\` run failed, so \`Casks/pwrsnap.rb\` is **not**"
            echo "tracking the latest stable PwrSnap release."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Cask is pinned at | \`${CURRENT:-unknown}\` |"
            echo "| Latest stable resolved to | \`${RESOLVED:-unresolved}\` |"
            echo "| Failed run | ${RUN_URL} |"
            echo
            echo "Until this is fixed, \`brew install --cask pwrdrvr/tap/pwrsnap\` and"
            echo "\`brew upgrade\` keep serving the pinned version. Users who already have"
            echo "the app still get updates in-app (the cask is \`auto_updates true\`);"
            echo "new installs do not."
            echo
            echo "Filed once per outage. Close it once the bump PR merges -- the next"
            echo "failure opens a fresh one."
          } >"${body}"

          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Cask bump is failing -- pwrsnap pinned at ${CURRENT:-unknown}" \
            --label bump-failure \
            --body-file "${body}"
